type Cinema {
    id: String
    rooms: [Room]
}

type Room {
    id: String
    seats: [Seat]
    type: RoomType
    sizeType: RoomSizeType
    capacity: Int
}

type Seat {
    id: String
    row: Int
    number: Int
    type: SeatType
    status: SeatStatus
}

enum SeatStatus {
    AVAILABLE
    RESERVED
    SOLD
}

enum RoomType {
    VIP
    STANDARD
}

enum RoomSizeType {
    SMALL
    MEDIUM
    LARGE
}

enum SeatType {
    VIP
    STANDARD
}

type Ticket {
    id: String
    seat: Seat
    price: Float
    discount: Float
    total: Float
    status: TicketStatus
    type: TicketType
    purchaseDate: String
    isValidate: Boolean
}

enum TicketStatus {
    AVAILABLE
    RESERVED
    SOLD
}

enum TicketType {
    VIP
    STANDARD
}

type Movie {
    id: String
    title: String
    description: String
    duration: Int
    genre: String
    releaseDate: String
    director: String
    actors: [String]
    rating: Float
    poster: String
    trailer: String
}

type Screening {
    id: String
    movie: Movie
    cinema: Cinema
    room: Room
    date: String
    time: String
    tickets: [Ticket]
    seats: [Seat]
    status: ScreeningStatus
}

enum ScreeningStatus {
    UPCOMING
    IN_PROGRESS
    FINISHED
}

type Query {
    cinemas: [Cinema]
    cinema(id: String): Cinema
    rooms: [Room]
    room(id: String): Room
    seats: [Seat]
    seat(id: String): Seat
    tickets: [Ticket]
    ticket(id: String): Ticket
    movies: [Movie]
    movie(id: String): Movie
    screenings: [Screening]
    screening(id: String): Screening
}